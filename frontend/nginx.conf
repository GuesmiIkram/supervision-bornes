server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Les appels API sont transmis au backend Spring Boot
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    # Routage Angular : toutes les autres URL renvoient index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
